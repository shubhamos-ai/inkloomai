services:
  # ── Backend (FastAPI + NVIDIA NIM) ──────────────────────────────────────────
  - type: web
    name: inkloom-backend
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEBUG
        value: false
      - key: PIPELINE_MODE
        value: ai
      - key: VISION_PROVIDER
        value: nvidia_nim
      - key: NVIDIA_API_KEY
        sync: false          # set manually in Render dashboard (secret)
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-db
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: CORS_ORIGINS
        value: https://inkloom-ai.shubhamos.com,https://inkloom-frontend.onrender.com,https://inkloom-frontend-rwy2.onrender.com
      - key: CORS_EXTRA_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      - key: DISABLE_DEV_AUTH
        value: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      # Render cannot share one persistent disk across services, so a standalone
      # worker cannot read uploads unless storage is S3-backed. "auto" runs the
      # loop in-process for local storage and leaves queue draining to the
      # dedicated worker once STORAGE_BACKEND=s3 is configured.
      - key: RUN_EMBEDDED_WORKER
        value: auto
      - key: WORKER_ALLOW_LOCAL_ANALYSIS
        value: "false"
      # ── Cookie sessions / CSRF ───────────────────────────────────────────────
      # Same-site Render subdomains work with "lax". Set "none" + COOKIE_SECURE
      # "true" if the frontend is served from a different registrable domain.
      - key: COOKIE_SAMESITE
        value: lax
      - key: SESSION_LIFETIME_DAYS
        value: "30"
      # ── Object Storage (S3-compatible) ───────────────────────────────────────
      # Set STORAGE_BACKEND=s3 and fill in S3_* vars when using Cloudflare R2 /
      # AWS S3 / MinIO. Leave as "local" to use the mounted disk below.
      - key: STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false          # set in Render dashboard (secret)
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PREFIX
        value: inkloom/
      - key: STORAGE_CACHE_DIR
        value: /var/data/cache
      # ── Extraction ───────────────────────────────────────────────────────────
      - key: EXTRACTION_PROVIDER
        value: auto
    disk:
      name: inkloom-storage
      mountPath: /var/data
      sizeGB: 1

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  - type: web
    name: inkloom-frontend
    runtime: node
    rootDir: .
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      # NEXT_PUBLIC_* vars are baked in at BUILD time and used by the browser,
      # so they must be the backend's PUBLIC url (fromService property 'host'
      # returns the private-network hostname, which browsers cannot reach).
      # Update this if your onrender subdomain differs (Render may add a hash
      # suffix when the name is taken).
      - key: NEXT_PUBLIC_AI_API_URL
        value: https://inkloom-backend-yw07.onrender.com
      - key: NEXT_PUBLIC_USE_MOCK
        value: false

# ── Optional: dedicated background worker ────────────────────────────────────
# Only needed once STORAGE_BACKEND=s3 (so the worker can read the same uploads
# as the web service). Background workers are a paid Render service type; the
# free-plan deployment runs the queue in-process via RUN_EMBEDDED_WORKER=auto.
#
# - type: worker
#   name: inkloom-worker
#   runtime: python
#   rootDir: server
#   plan: starter
#   buildCommand: pip install -r requirements.txt
#   startCommand: python -m app.worker
#   envVars:
#     - key: DATABASE_URL
#       fromDatabase:
#         name: inkloom-db
#         property: connectionString
#     - key: STORAGE_BACKEND
#       value: s3
#     - key: S3_BUCKET
#       sync: false
#     - key: S3_ENDPOINT_URL
#       sync: false
#     - key: S3_ACCESS_KEY_ID
#       sync: false
#     - key: S3_SECRET_ACCESS_KEY
#       sync: false
#     - key: VISION_PROVIDER
#       value: nvidia_nim
#     - key: NVIDIA_API_KEY
#       sync: false

# ── Database (PostgreSQL) ────────────────────────────────────────────────────
databases:
  - name: inkloom-db
    databaseName: inkloom
    user: inkloom
    plan: free