services:
  # ── Backend (FastAPI + NVIDIA NIM) ──────────────────────────────────────────
  - type: web
    name: inkloom-backend
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEBUG
        value: false
      - key: PIPELINE_MODE
        value: ai
      - key: VISION_PROVIDER
        value: nvidia_nim
      - key: NVIDIA_API_KEY
        sync: false          # set manually in Render dashboard (secret)
      - key: DATABASE_URL
        fromDatabase:
          name: inkloom-db
          property: connectionString
      - key: STORAGE_DIR
        value: /var/data/storage
      - key: CORS_ORIGINS
        value: https://inkloom-ai.shubhamos.com,https://inkloom-frontend.onrender.com
      - key: CORS_EXTRA_ORIGINS
        value: http://localhost:3000
      - key: DISABLE_DEV_AUTH
        value: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      # Render cannot share one persistent disk across services, so a standalone
      # worker cannot read uploads. Run the job loop inside the API process.
      - key: RUN_EMBEDDED_WORKER
        value: true
    disk:
      name: inkloom-storage
      mountPath: /var/data
      sizeGB: 1

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  - type: web
    name: inkloom-frontend
    runtime: node
    rootDir: .
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      # NEXT_PUBLIC_* vars are baked in at BUILD time and used by the browser,
      # so they must be the backend's PUBLIC url (fromService property 'host'
      # returns the private-network hostname, which browsers cannot reach).
      # Update this if your onrender subdomain differs (Render may add a hash
      # suffix when the name is taken).
      - key: NEXT_PUBLIC_AI_API_URL
        value: https://inkloom-backend.onrender.com
      - key: NEXT_PUBLIC_USE_MOCK
        value: false

# ── Database (PostgreSQL) ────────────────────────────────────────────────────
databases:
  - name: inkloom-db
    databaseName: inkloom
    user: inkloom
    plan: free